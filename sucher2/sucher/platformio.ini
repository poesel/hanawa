; The esp32cam board default is huge_app.csv: one single app slot (app0) and
; therefore no OTA slot. ArduinoOTA then cannot find a target - esp_ota_get_next_update_partition()
; returns the running partition, Update::begin() fails with "Partition Could Not be
; Found" (that line only appears on the serial console) and espota.py just reports
; "No response from device". ota_nofs_4MB.csv gives two ~1.9 MB app slots
; (app0 @0x10000, app1 @0x200000) on this 4 MB ESP32-CAM - same shape as the
; Leuchter's default_16MB.csv, where OTA works. Both envs must use the same
; table, otherwise the OTA build and the serial build disagree about the layout.

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
lib_deps =
  bblanchon/ArduinoJson @ ^6.21.4
board_build.partitions = ota_nofs_4MB.csv
monitor_speed = 115200
upload_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=1

; Same sources, but the firmware is pushed over WLAN (ArduinoOTA, port 8266)
; instead of the serial cable - like env:ota on the Leuchter. Needs an
; already running OTA-capable build; the very first flash still goes over
; serial with the env:esp32cam above (it installs the partition table with
; the second app slot that ArduinoOTA writes into). Upload with the ESP's own IP:
;   pio run -d sucher2/sucher -e ota -t upload --upload-port <ESP-IP>
[env:ota]
platform = espressif32
board = esp32cam
framework = arduino
lib_deps =
  bblanchon/ArduinoJson @ ^6.21.4
board_build.partitions = ota_nofs_4MB.csv
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=1
upload_protocol = espota
