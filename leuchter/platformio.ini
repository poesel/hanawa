; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:d1mini]
platform = espressif8266
board = d1_mini
framework = arduino
lib_deps = 
build_flags = 
	-DLED_COUNT=42
	-DMAX_RX_LEDS=150
build_type = release

; Same sources, but the firmware is pushed over WLAN (ArduinoOTA, port 8266)
; instead of the serial cable. Needs a build that already carries ArduinoOTA -
; the very first one still goes over serial with the env above.
[env:ota]
platform = espressif8266
board = d1_mini
framework = arduino
lib_deps = 
build_flags = 
	-DLED_COUNT=42
	-DMAX_RX_LEDS=150
build_type = release
upload_protocol = espota
