; Throw-away helper sketch: blink the first 10 LEDs and swap the clock/data
; roles every 10 s. Flash it over the air (the ESP has no serial any more):
;   pio run -d leuchter/wire_test -e ota -t upload --upload-port <ESP-IP>
[env:ota]
platform = espressif8266
board = d1_mini
framework = arduino
build_type = release
upload_protocol = espota
